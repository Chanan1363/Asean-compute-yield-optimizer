<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASEAN Grid — Node Monitor (ฝั่ง Supply)</title>
<style>
  :root { --bg:#0a0e1a; --panel:#111827; --border:#1e3a5f; --cyan:#22d3ee; --green:#34d399; --gold:#fbbf24; --red:#f87171; --text:#e5e7eb; --dim:#9ca3af; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI','Noto Sans Thai',Tahoma,sans-serif; background:radial-gradient(1200px 600px at 80% -10%,#0e2a4a 0%,var(--bg) 55%); color:var(--text); min-height:100vh; padding:24px; }
  .wrap { max-width:1080px; margin:0 auto; }
  .hero { text-align:center; padding:22px 20px 24px; border:1px solid var(--border); border-radius:18px; background:linear-gradient(180deg,rgba(34,211,238,0.08),rgba(17,24,39,0.6)); margin-bottom:20px; }
  .hero h1 { font-size:26px; background:linear-gradient(90deg,var(--cyan),#7dd3fc,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p { color:var(--dim); margin-top:8px; font-size:14px; }
  .stats { display:flex; gap:12px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .stat { padding:8px 18px; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,0.03); font-size:13px; }
  .stat b { color:var(--green); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .node { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px; transition:border-color .2s; }
  .node:hover { border-color:var(--cyan); }
  .node-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .node-id { font-size:15px; font-weight:bold; color:var(--cyan); }
  .badge { font-size:11px; padding:4px 12px; border-radius:999px; }
  .badge.online { background:rgba(52,211,153,0.15); color:var(--green); border:1px solid rgba(52,211,153,0.4); }
  .badge.offline { background:rgba(148,163,184,0.1); color:var(--dim); border:1px solid rgba(148,163,184,0.3); }
  .row { display:flex; justify-content:space-between; font-size:13px; color:var(--dim); padding:3px 0; }
  .row b { color:var(--text); }
  .util-bar { height:8px; background:#1e293b; border-radius:99px; margin-top:8px; overflow:hidden; }
  .util-fill { height:100%; background:linear-gradient(90deg,var(--cyan),var(--green)); border-radius:99px; transition:width .5s; }
  .footer { text-align:center; color:var(--dim); font-size:12px; margin-top:24px; }
  .empty { text-align:center; color:var(--dim); padding:40px; border:1px dashed var(--border); border-radius:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>⚡ ASEAN GRID — NODE MONITOR</h1>
    <p>ฝั่ง Supply — เครื่องเกมเมอร์ที่เข้าร่วมระบบ / Gamer nodes connected to the grid</p>
    <div class="stats">
      <div class="stat">โหนดทั้งหมด <b id="total">0</b></div>
      <div class="stat">ออนไลน์ <b id="online">0</b></div>
      <div class="stat">อัปเดตอัตโนมัติทุก <b>10 วิ</b></div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="footer">ASEAN Grid — Node Agent v0 · AGPL-3.0 · หน้าจอฝั่ง Supply (ยังไม่มีตัวให้โหลด — ใช้ URL นี้ดูสถานะ)</div>
</div>

<script>
async function load() {
  try {
    const r = await fetch('/nodes');
    const d = await r.json();
    const nodes = d.nodes || [];
    document.getElementById('total').textContent = nodes.length;
    document.getElementById('online').textContent = nodes.filter(n => n.status === 'online').length;
    const grid = document.getElementById('grid');
    if (!nodes.length) { grid.innerHTML = '<div class="empty">ยังไม่มีโหนด — รอเกมเมอร์เครื่องแรกเข้าร่วม 🎮</div>'; return; }
    grid.innerHTML = nodes.map(n => {
      const online = n.status === 'online';
      const util = Math.min(100, n.gpu_util_pct || 0);
      return `<div class="node">
        <div class="node-head">
          <span class="node-id">🖥️ ${n.node_id}</span>
          <span class="badge ${online ? 'online' : 'offline'}">${online ? '● ออนไลน์' : '○ ออฟไลน์'}</span>
        </div>
        <div class="row"><span>ชื่อเครื่อง</span><b>${n.name}</b></div>
        <div class="row"><span>GPU</span><b>${n.gpu_model}</b></div>
        <div class="row"><span>ภูมิภาค</span><b>${n.region}</b></div>
        <div class="row"><span>GPU ใช้งาน</span><b>${util.toFixed(1)}%</b></div>
        <div class="util-bar"><div class="util-fill" style="width:${util}%"></div></div>
      </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="empty">⚠️ เชื่อม API ไม่ได้ — ลองใหม่ใน 10 วิ</div>';
  }
}
load();
setInterval(load, 10000);
</script>
</body>
</html>
